    "tests/core/problems/cvrp/test_sampler.py",
    "tests/core/problems/cvrp/test_solution.py",
    "tests/core/problems/test_dataset.py",
    "tests/core/ui/test_forms.py",
]
rules = { unresolved-attribute = "warn" }

[[tool.ty.overrides]]
include = [
    "core/models/attention_model/module.py",
    "core/models/layers/batched_gru_cell.py",
    "core/models/nds/decoders/one_pass/simple.py",
    "core/models/nds/decoders/one_pass/slot.py",
