    "core/models/nds/encoders/split.py",
    "core/problems/archive/op.py",
    "core/problems/cvrp/render.py",
    "core/problems/palette.py",
    "core/problems/solution.py",
    "core/solve.py",
    "experiments/eval.py",
    "experiments/train.py",
    "experiments/warmup_flags_ablation.py",
    "figures/rollouts_vs_steps.py",
    "figures/train_time.py",
    "tests/core/lns/operators/repair/apply_repair_templates.py",
    "tests/core/lns/test_improvement_step.py",
    "tests/core/lns/test_search.py",
