[project]
name = "master-thesis-code"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Arkadiusz Paterak" }
]
requires-python = ">=3.12"
dependencies = [
    "drawdata>=0.5.1",
    "iprogress>=0.4",
    "ipykernel>=7.2.0",
    "ipython>=9.10.0",
    "ipywidgets>=8.1.8",
    "marimo[recommended]>=0.20.4",
    "matplotlib>=3.10.8",
    "notebook>=7.5.4",
    "numba>=0.65.1",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "polars>=1.20.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "rich>=14.3.3",
    "rl4co>=0.6.0",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tensordict>=0.11.0",
    "torch>=2.9.0",
    "torch-geometric>=2.7.0",
    "torchinfo>=1.8.0",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "vrplib>=2.2.0",
    "wandb>=0.25.1",
    "wigglystuff>=0.3.1",
    "questionary>=2.1.0",
    # "triton-windows<3.3"  # Not working properly on Windows with my code and newer PyTorch
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
    "scipy-stubs>=1.17.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "E",
    "F",
    "I",
    "UP",
    "SIM",
]
ignore = [
    "F403", # Allow star imports (TODO: Refactor to avoid star imports)
    "E501",
    "E731", # Allow lambda assignments
    "E712",
]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.format]
quote-style = "double"  # Use double quotes for strings
indent-style = "space"  # Indent with spaces
skip-magic-trailing-comma = false  # Respect magic trailing commas
line-ending = "auto"  # Automatically detect line ending
docstring-code-format = true  # Format code blocks in docstrings

[tool.pytest.ini_options]
addopts = "-m 'not experiment'"
markers = [
    "experiment: tests that check if experiment scripts are runnable",
]
