problem:
  name: cvrp
  size: 100

model:
  hidden_dim: 128
  num_heads: 8
  ff_dim: 512
  encoder_mode: split
  positional_encoding:
    dim: 16
  decoder:
    type: ar
    use_hidden_decoding_state: false
  encoder:
    norm_type: instance
    with_neighbours_encoding: true
    with_route_encoding: true
    num_solution_attention_layers: 0

optimizer:
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6

trainer:
  epochs: 25
  instances_per_epoch: 1500
  batch_size: 64
  num_main_improvement_steps: 100

search:
  repair_type: greedy_insert
  num_improvement_steps: 10
  num_rollouts: 128
  deconstruction_size: 15
  improvement_step_type: numba_sequential
  n_repairs: 5
  first_repair_uses_rollout_order: true
  insert_in_new_routes_only: true
  start_solution_params:
    insert_in_affected_routes_only: false
    num_improvement_steps: 50
    deconstruction_size: 15
  acceptance:
    type: greedy

amp:
  enabled: true
  dtype: float16

logging:
  wandb_project: nds

validation:
  validate_before_training: true
  num_instances: 1000
  batch_size: 100
  every_n_epochs: 1
  dataset_path: data/synthetic/cvrp/vrp100_valid_seed1233.pkl
  plot_enabled: true
  plot_every_n_improvement_steps: 5
  plot_save_to_disk: true
  search:
    repair_type: greedy_insert
    num_improvement_steps: 50
    num_rollouts: 100
    deconstruction_size: 15
    improvement_step_type: numba_sequential
    first_repair_uses_rollout_order: true
    insert_in_new_routes_only: true
    start_solution_params:
      insert_in_affected_routes_only: false
      num_improvement_steps: 50
      deconstruction_size: 15
    n_repairs: 5
    n_augmentations: 1
    acceptance:
      type: sa
