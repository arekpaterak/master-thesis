problem:
  name: cvrp
  size: 20

model:
  hidden_dim: 128
  num_heads: 8
  ff_dim: 512
  encoder_mode: joint
  positional_encoding:
    dim: 16
  decoder:
    type: ar
    use_hidden_decoding_state: true

optimizer:
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6

trainer:
  epochs: 100
  instances_per_epoch: 1500
  batch_size: 256
  num_main_improvement_steps: 10

search:
  repair_type: greedy_insert
  num_improvement_steps: 0
  num_rollouts: 128
  deconstruction_size: 5
  improvement_step_type: numba_sequential
  n_repairs: 5
  insert_in_new_routes_only: true
  first_repair_uses_rollout_order: true
  start_solution_params:
    num_improvement_steps: 0
  acceptance:
    type: greedy

amp:
  enabled: true
  dtype: float16

logging:
  wandb_project: nds

validation:
  validate_before_training: true
  num_instances: 1000
  batch_size: 250
  every_n_epochs: 1
  seed: 42
  plot_enabled: true
  plot_every_n_improvement_steps: 5
  plot_save_to_disk: true
  search:
    repair_type: greedy_insert
    num_improvement_steps: 10
    num_rollouts: 100
    deconstruction_size: 5
    improvement_step_type: numba_sequential
    first_repair_uses_rollout_order: true
    insert_in_new_routes_only: true
    start_solution_params:
      num_improvement_steps: 0
    n_repairs: 5
    acceptance:
      type: greedy
    n_augmentations: 8
