problem:
  name: cvrp
  size: 100

model:
  hidden_dim: 128
  num_heads: 8
  ff_dim: 512
  poly_dim: 256
  seed_dim: 10

optimizer:
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6

trainer:
  epochs: 10
  batches_per_epoch: 500
  batch_size: 64
  num_main_improvement_steps: 2

search:
  num_improvement_steps: 0
  num_rollouts: 128
  deconstruction_size: 15
  improvement_step_type: sequential

logging:
  wandb_project: nds
