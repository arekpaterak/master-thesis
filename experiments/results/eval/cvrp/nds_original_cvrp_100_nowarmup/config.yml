name: nds_pretrained_cvrp_100
method:
  type: nds-pretrained
  checkpoint_path: experiments\pretrained\nds\cvrp_100\checkpoint-2000.pt
  model:
    problem_name: cvrp
    hidden_dim: 128
    num_heads: 8
    ff_dim: 512
    positional_encoding: null
    decoder:
      poly_dim: 256
      seed_dim: 10
      with_poly: true
      type: ar
      use_hidden_decoding_state: true
    init_weights: null
    encoder_mode: joint
    encoder:
      norm_type: instance
      pre_norm: false
      with_final_norm: false
      ff_activation: relu
      encoding_order: route_neighbours
      route_aggregation: sum
      with_neighbours_encoding: true
      with_route_encoding: null
      num_pre_attention_layers: 2
      num_post_attention_layers: 2
    original_pretrained_weights: null
    freeze_encoder: false
  search:
    repair_type: greedy_insert
    num_improvement_steps: 100
    num_rollouts: 100
    deconstruction_size: 15
    n_repairs: 5
    first_repair_uses_rollout_order: true
    improvement_step_type: numba_sequential
    apply_and_repair_backend: numba
    insert_in_new_routes_only: true
    acceptance:
      type: sa
      temperature_start: 0.1
      temperature_min: 0.001
      augmented_exchange:
        enabled: true
        threshold_factor: 15.0
    start_solution_params:
      num_improvement_steps: 0
      deconstruction_size: 15
      destroy_type: random_node
    n_augmentations: 1
problems:
- kind: synthetic
  problem:
    name: cvrp
    size: 100
    vehicle_capacity_raw: null
    min_demand_raw: 1
    max_demand_raw: 9
    min_coordinate: 0.0
    max_coordinate: 1.0
  dataset_path: data/synthetic/cvrp/vrp100_test_seed1234.pkl
  num_test_instances: 10000
  batch_size: 100
  test_seed: 2026
- kind: cvrplib
  set_name: X
  min_customers: 0
  max_customers: 300
num_plot_instances: 0
logging:
  wandb_project: nds
